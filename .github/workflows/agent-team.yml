name: agent-team

on:
  pull_request:
    paths: ["plugins/geevs-agent-team/**", ".claude-plugin/**", ".github/workflows/agent-team.yml"]
  push:
    branches: [master]
    paths: ["plugins/geevs-agent-team/**", ".claude-plugin/**", ".github/workflows/agent-team.yml"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - name: Lint, complexity, security rules
        run: >
          ruff check --select C901,PLR0911,PLR0912,PLR0913,PLR0915,E,F,B,SIM,UP,S
          --ignore S603,S607,S101,S404 --line-length 120
          plugins/geevs-agent-team/hooks plugins/geevs-agent-team/scripts plugins/geevs-agent-team/tests
      - name: Unit tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python -m unittest discover -s plugins/geevs-agent-team/tests
      - name: Manifests parse
        run: |
          python -c "import json; json.load(open('plugins/geevs-agent-team/.claude-plugin/plugin.json'))"
          python -c "import json; json.load(open('plugins/geevs-agent-team/hooks/hooks.json'))"
          python -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
